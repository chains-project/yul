[project]
name = "httpclient"
version = "0.1.0"
description = "Script client with explicit HTTP connection pooling and retry control"
requires-python = ">=3.11"
dependencies = [
    "urllib3>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.0",
]
