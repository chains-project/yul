[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-fetch"
version = "0.1.0"
description = "Fetch HTTPS URLs verified against certifi's up-to-date Mozilla root CA bundle"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "certifi>=2024.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
secure-fetch = "secure_fetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_fetch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
