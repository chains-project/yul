[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-https"
version = "0.1.0"
description = "HTTPS client that verifies connections against certifi's root CA bundle"
requires-python = ">=3.9"
dependencies = [
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
py-modules = ["secure_https"]
