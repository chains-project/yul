[package]
name = "systool"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A systems tool that calls native C libraries and uses OS-level C types."
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
