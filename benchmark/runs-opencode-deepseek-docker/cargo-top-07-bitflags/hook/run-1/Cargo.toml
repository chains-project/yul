[package]
name = "typed-flags"
version = "0.1.0"
edition = "2021"
description = "Type-safe bitflag sets that can be combined and checked"
license = "MIT OR Apache-2.0"
keywords = ["bitflags", "flags", "bitset"]
categories = ["data-structures"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
bitflags = "2.13.2"
