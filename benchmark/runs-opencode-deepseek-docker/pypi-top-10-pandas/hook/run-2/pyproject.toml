[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csvdata"
version = "0.1.0"
description = "Load, clean and analyze tabular data from CSV files using only the standard library."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
csvdata = "csvdata.cli:main"

[tool.setuptools.packages.find]
include = ["csvdata*"]
