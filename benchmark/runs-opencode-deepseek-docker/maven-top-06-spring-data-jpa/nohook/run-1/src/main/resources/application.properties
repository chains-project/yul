spring.application.name=demo

# --- Default (development): in-memory H2 ---
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# Use "validate" (with Flyway/Liquibase) or "none" in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Production example: PostgreSQL ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/demodb
