spring.application.name=product-service

# DataSource - H2 in-memory database, used by default for local development
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# To persist to PostgreSQL, run with the "postgres" profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Connection settings live in src/main/resources/application-postgres.properties
