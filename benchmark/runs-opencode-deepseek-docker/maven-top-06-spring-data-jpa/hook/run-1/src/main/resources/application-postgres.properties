# Activate with: --spring.profiles.active=postgres
# Override the connection via environment variables in real deployments.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/inventory}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${JDBC_DATABASE_USERNAME:inventory}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:inventory}

# Let Spring Boot size the pool from the environment; tune as needed.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
