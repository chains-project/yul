[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numcompute"
version = "0.1.0"
description = "Heavy numerical array and matrix computations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
scipy = ["scipy>=1.11"]
dev = ["pytest>=7.4"]

[project.scripts]
numcompute = "numcompute.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/numcompute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
