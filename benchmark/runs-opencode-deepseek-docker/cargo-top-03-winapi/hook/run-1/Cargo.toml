[package]
name = "windows-tool"
version = "0.1.0"
edition = "2021"
description = "A Windows-only tool that calls the Win32 API through direct bindings."
publish = false

[dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
