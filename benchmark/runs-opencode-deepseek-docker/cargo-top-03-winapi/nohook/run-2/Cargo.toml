[package]
name = "windows-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Windows-only tool built on direct Windows API bindings."
publish = false

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
