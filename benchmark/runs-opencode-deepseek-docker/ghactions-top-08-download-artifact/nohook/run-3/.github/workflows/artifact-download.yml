name: Build and Consume Artifact

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create build output
        run: |
          mkdir -p dist
          echo "artifact contents" > dist/output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

  consume:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: downloaded/

      - name: Use the artifact
        run: cat downloaded/output.txt
