[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldclock"
version = "0.1.0"
description = "Work with timezone-aware datetimes across regions of the world."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
worldclock = "worldclock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worldclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
