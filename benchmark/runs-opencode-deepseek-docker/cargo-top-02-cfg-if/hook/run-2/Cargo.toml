[package]
name = "xplat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small library demonstrating clean, readable cross-platform conditional compilation."
license = "MIT OR Apache-2.0"
readme = false
keywords = ["cross-platform", "cfg", "conditional-compilation", "no-std"]
categories = ["no-std", "development-tools"]

[features]
default = ["std"]
std = []

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"

[dependencies]
cfg-if = "1.0.5"

[target."cfg(unix)".dependencies]
libc = { version = "0.2.189", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
