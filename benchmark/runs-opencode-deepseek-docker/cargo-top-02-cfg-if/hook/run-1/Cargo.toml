[package]
name = "crossplat"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A cross-platform library built around clean, readable conditional compilation."
license = "MIT OR Apache-2.0"
keywords = ["cross-platform", "cfg", "portability", "portable"]
categories = ["development-tools"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
cfg-if = "1.0.5"

[build-dependencies]
cfg_aliases = "0.2.1"
