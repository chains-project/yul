name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Caches the module download cache (~/go/pkg/mod) and the build
          # cache (~/.cache/go-build), keyed on the hash of go.sum.
          cache: true
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go test ./... -v
