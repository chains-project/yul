name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TODO: set up your toolchain here (e.g. actions/setup-node, actions/setup-go).

      # TODO: replace with your project's build command. It should write its
      # output to the directory uploaded below.
      - name: Build
        run: make build

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: dist/
          if-no-files-found: error
          retention-days: 14
