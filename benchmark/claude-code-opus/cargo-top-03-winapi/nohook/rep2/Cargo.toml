[package]
name = "wintool"
version = "0.1.0"
edition = "2024"
publish = false

# Windows-only: the Win32 bindings are only pulled in when targeting Windows.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
