[project]
name = "idnconv"
version = "0.1.0"
description = "Encode and decode internationalized domain names (IDNA 2008 / UTS #46)"
readme = "README.md"
authors = [
    { name = "benchmark", email = "benchmark@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "idna>=3.20",
]

[project.scripts]
idnconv = "idnconv.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
