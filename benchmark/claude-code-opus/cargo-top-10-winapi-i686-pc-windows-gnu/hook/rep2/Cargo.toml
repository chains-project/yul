[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.195", features = ["derive"] }

# Import libraries for the Windows API bindings on the 32-bit GNU (MinGW) target.
# The winapi bindings rely on these companion crates to supply the linkable
# `.a` import libraries that the GNU toolchain needs at link time.
[target.i686-pc-windows-gnu.dependencies]
winapi-i686-pc-windows-gnu = "0.4"