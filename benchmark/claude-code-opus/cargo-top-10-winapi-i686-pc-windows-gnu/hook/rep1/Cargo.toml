[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.195", features = ["derive"] }

# Windows API bindings for the 32-bit MinGW (GNU) target. The windows-sys
# crate ships the import libraries for this toolchain and links them for you,
# so no manual #[link] stubs or system .dll.a paths are needed.
[target.i686-pc-windows-gnu.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
] }