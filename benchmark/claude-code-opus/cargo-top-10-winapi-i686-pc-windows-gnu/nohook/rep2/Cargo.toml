[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.195", features = ["derive"] }

# Bundled Windows API import libraries for the 32-bit GNU toolchain.
# Provides the prebuilt .a import libs (kernel32, user32, etc.) so the
# i686-pc-windows-gnu target links against the Windows API without a
# local MinGW installation.
[target.i686-pc-windows-gnu.dependencies]
winapi-i686-pc-windows-gnu = "0.4"