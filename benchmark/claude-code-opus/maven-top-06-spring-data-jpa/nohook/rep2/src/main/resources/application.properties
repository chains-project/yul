spring.application.name=demo

# Default: in-memory H2 database
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Generates/updates the schema from entities. Replace with Flyway/Liquibase migrations
# (and set to "validate") before going to production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
