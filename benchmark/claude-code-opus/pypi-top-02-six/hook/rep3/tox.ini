[tox]
# Testing py27 needs tox<4 with virtualenv<20.22 (newer releases dropped 2.7 support).
envlist = py27, py36, py37, py38, py39, py310, py311, py312, py313, lint
isolated_build = true

[testenv]
extras = test
commands = pytest {posargs}

[testenv:lint]
basepython = python3
skip_install = true
deps = flake8
commands = flake8 src tests
