[metadata]
name = mylib
version = attr: mylib.__version__
description = A library supporting both Python 2.7 and Python 3.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
package_dir =
    = src
packages = find:
python_requires = >=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*
zip_safe = False

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest>=4.6,<5 ; python_version < "3"
    pytest>=6 ; python_version >= "3"

[bdist_wheel]
# Pure-Python code that runs unmodified on 2 and 3: build a single py2.py3 wheel.
universal = 1

[flake8]
max-line-length = 100
exclude = .git,.tox,build,dist,*.egg-info
