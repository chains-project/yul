[tox]
envlist = py27, py36, py37, py38, py39, py310, py311, py312, py313, lint
# tox 4 dropped Python 2.7 virtualenv support; use tox<4 with virtualenv<20.22
# to run the py27 environment.
skip_missing_interpreters = true

[testenv]
extras = test
commands = pytest {posargs}

[testenv:lint]
skip_install = true
deps = flake8
commands = flake8 src tests setup.py
