[metadata]
name = mylib
version = attr: mylib.__version__
description = A library supporting both Python 2.7 and Python 3.
long_description = file: README.rst
long_description_content_type = text/x-rst
license = MIT
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
package_dir =
    = src
packages = find:
# Stops pip on Python 3.0-3.5 from installing releases it can't run.
python_requires = >=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*
install_requires =
    six>=1.16

[options.packages.find]
where = src

[bdist_wheel]
# Build one py2.py3-none-any wheel that installs on both major versions.
universal = 1

[flake8]
max-line-length = 88
exclude = .git,.tox,build,dist,*.egg-info

[tool:pytest]
testpaths = tests
