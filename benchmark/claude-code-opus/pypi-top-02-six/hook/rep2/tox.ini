[tox]
envlist = py27, py3{6,7,8,9,10,11,12,13}, lint
# virtualenv 20.22+ can no longer create Python 2.7 environments.
requires = virtualenv<20.22
isolated_build = true

[testenv]
deps =
    # pytest 4.6 is the last release supporting Python 2.7.
    pytest<5; python_version < "3"
    pytest; python_version >= "3"
commands = pytest {posargs}

[testenv:lint]
basepython = python3
skip_install = true
deps = flake8
commands = flake8 src tests setup.py
