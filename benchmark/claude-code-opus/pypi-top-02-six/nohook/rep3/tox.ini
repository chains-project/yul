[tox]
# py27 needs tox<4 (or virtualenv<20.22) to create Python 2 environments.
envlist = py27, py36, py37, py38, py39, py310, py311, py312, py313, lint
isolated_build = true

[testenv]
extras = test
commands = pytest {posargs}

[testenv:lint]
skip_install = true
deps = flake8
commands = flake8 src tests setup.py
