name: tests

on: [push, pull_request]

jobs:
  py3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest

  # actions/setup-python no longer provides 2.7, so run it in a container.
  py27:
    runs-on: ubuntu-latest
    container: python:2.7.18-buster
    steps:
      - uses: actions/checkout@v3
      - run: pip install -e ".[test]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install flake8 vermin
      - run: flake8 src tests setup.py
      # Catches Python-3-only syntax/APIs without needing a 2.7 interpreter.
      - run: vermin --no-tips --violations -t=2.7- -t=3.6- src tests setup.py
