[metadata]
name = mylib
version = attr: mylib.__version__
description = A library supporting both Python 2.7 and Python 3.
long_description = file: README.md
long_description_content_type = text/markdown
author = Your Name
author_email = you@example.com
url = https://github.com/your-org/mylib
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
package_dir =
    = src
packages = find:
python_requires = >=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*, !=3.5.*
zip_safe = False

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest>=4.6

[bdist_wheel]
# Produce a single py2.py3-none-any wheel.
universal = 1

[flake8]
max-line-length = 100
exclude = .git,.tox,build,dist,*.egg-info

[tool:pytest]
testpaths = tests
