[tox]
# tox 4 and virtualenv >= 20.22 can no longer create Python 2.7 environments,
# so pin both; tox will auto-provision these versions if needed.
requires =
    tox<4
    virtualenv<20.22
envlist = py27, py3{6,7,8,9,10,11,12,13}, lint
isolated_build = true

[testenv]
extras = test
commands = pytest {posargs}

[testenv:lint]
basepython = python3
skip_install = true
deps =
    flake8
    vermin
commands =
    flake8 src tests setup.py
    vermin --no-tips --violations -t=2.7- -t=3.6- src tests setup.py
