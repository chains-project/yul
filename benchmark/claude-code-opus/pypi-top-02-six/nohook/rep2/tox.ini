[tox]
envlist = py27, py36, py37, py38, py39, py310, py311, py312, py313, pypy, pypy3, lint
isolated_build = True
skip_missing_interpreters = True

[testenv]
extras = test
commands = pytest {posargs}

[testenv:lint]
skip_install = True
deps = flake8
commands = flake8 src tests

[pytest]
testpaths = tests
