[project]
name = "worldtime"
version = "0.1.0"
description = "Work with timezone-aware datetimes across world regions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # zoneinfo reads the OS tz database; tzdata is the fallback where none
    # exists (Windows, slim containers) and keeps rules current.
    "tzdata>=2025.2",
]

[project.scripts]
worldtime = "worldtime.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
