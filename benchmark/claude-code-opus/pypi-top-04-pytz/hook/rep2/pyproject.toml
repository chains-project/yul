[project]
name = "worldtime"
version = "0.1.0"
description = "Work with timezone-aware datetimes across world regions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # IANA tz database for zoneinfo; required on Windows, keeps data current elsewhere
    "tzdata>=2026.4",
]

[project.scripts]
worldtime = "worldtime.cli:main"

[dependency-groups]
dev = ["pytest>=9.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
