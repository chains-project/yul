[project]
name = "httpclient"
version = "0.1.0"
description = "Script with low-level HTTP control: connection pooling and automatic retries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2.2,<3",
]

[project.scripts]
httpclient = "httpclient.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpserver>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
