[project]
name = "http-client"
version = "0.1.0"
description = "HTTP script with explicit connection pooling and retry control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2.2,<3",
]

[project.scripts]
http-client = "http_client.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/http_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
