[project]
name = "secure-fetch"
version = "0.1.0"
description = "Script that makes HTTPS requests verified against an up-to-date root CA bundle"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.7.4",
]

[project.scripts]
secure-fetch = "secure_fetch.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
