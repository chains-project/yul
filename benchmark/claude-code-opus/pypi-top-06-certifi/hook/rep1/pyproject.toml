[project]
name = "certcheck"
version = "0.1.0"
description = "Check HTTPS connections using an up-to-date root CA bundle (certifi)"
readme = "README.md"
authors = [
    { name = "benchmark", email = "benchmark@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
]

[project.scripts]
certcheck = "certcheck:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
