[project]
name = "cert-check"
version = "0.1.0"
description = "HTTPS requests verified against the certifi root CA bundle"
readme = "README.md"
authors = [
    { name = "benchmark", email = "benchmark@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
]

[project.scripts]
cert-check = "cert_check:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
