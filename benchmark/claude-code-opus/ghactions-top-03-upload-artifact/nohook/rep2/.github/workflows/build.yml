name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Adjust the toolchain setup and build commands for your project.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The uploaded artifact appears in the "Artifacts" section
      # at the bottom of the workflow run's summary page.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/   # Change to your build output directory
          if-no-files-found: error
          retention-days: 14
