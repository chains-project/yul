[project]
name = "datewise"
version = "0.1.0"
description = "Parse human-written dates and relative expressions like 'the first Monday of next month'"
readme = "README.md"
authors = [
    { name = "benchmark", email = "benchmark@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dateparser>=1.4.3",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
datewise = "datewise.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
