[package]
name = "my_macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros that parse and transform Rust syntax trees"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
# `full` parses all Rust syntax (items, statements, expressions), not just
# derive inputs. `visit-mut` provides in-place AST traversal for transforms.
# `extra-traits` adds Debug/Eq/Hash on syntax nodes for inspection and tests.
syn = { version = "3.0.6", features = ["full", "extra-traits", "visit-mut"] }
