[package]
name = "my_macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
# "full": parse all Rust syntax (items, statements, expressions), not just derive inputs.
# "visit-mut": in-place AST traversal for transforms.
# "extra-traits": Debug/Eq/Hash on AST nodes — handy for debugging and tests.
syn = { version = "3.0.6", features = ["full", "visit-mut", "extra-traits"] }
