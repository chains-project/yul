spring.application.name=spring-data-jpa-demo

# H2 in-memory database for local development/testing.
# Swap these for a real RDBMS (Postgres/MySQL) connection in production.
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
