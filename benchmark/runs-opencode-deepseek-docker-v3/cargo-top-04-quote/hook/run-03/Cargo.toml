[package]
name = "codegen-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros that generate Rust source as token streams"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
