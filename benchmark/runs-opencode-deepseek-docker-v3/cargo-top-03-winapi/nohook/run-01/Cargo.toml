[package]
name = "win-tool"
version = "0.1.0"
edition = "2024"
description = "A Windows-only tool built on direct Windows API bindings"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
