# Activate with: --spring.profiles.active=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=${DB_USERNAME:demo}
spring.datasource.password=${DB_PASSWORD:demo}
spring.datasource.driver-class-name=org.postgresql.Driver

# Use a migration tool (e.g. Flyway/Liquibase) instead of ddl-auto in production.
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
