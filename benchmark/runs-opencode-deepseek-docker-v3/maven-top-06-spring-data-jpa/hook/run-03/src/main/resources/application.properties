spring.application.name=demo

# ---------------------------------------------------------------------------
# Default datasource: in-memory H2 (no external setup required)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# PostgreSQL (enable the "postgres" Spring profile to use instead of H2)
# ---------------------------------------------------------------------------
