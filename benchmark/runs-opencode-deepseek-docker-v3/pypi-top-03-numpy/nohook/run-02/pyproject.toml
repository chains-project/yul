[project]
name = "matrix-compute"
version = "0.1.0"
description = "Heavy numerical array and matrix computations"
authors = [
    { name = "benchmark", email = "benchmark@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.scripts]
matrix-compute = "matrix_compute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
