[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numerics"
version = "0.1.0"
description = "Heavy numerical array and matrix computations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
jit = ["numba>=0.59"]
gpu = ["cupy-cuda12x>=13.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
numerics = "numerics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/numerics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
