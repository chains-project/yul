[project]
name = "matcomp"
version = "0.1.0"
description = "Heavy numerical array and matrix computations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.scripts]
matcomp = "matcomp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matcomp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
