[project]
name = "worldtime"
version = "0.1.0"
description = "Timezone-aware datetime helpers for working across world regions"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2024.1",
]

[project.scripts]
worldtime = "worldtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldtime"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
