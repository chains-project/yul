[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldclock"
version = "0.1.0"
description = "Timezone-aware datetime utilities for working across world regions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
worldclock = "worldclock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worldclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
