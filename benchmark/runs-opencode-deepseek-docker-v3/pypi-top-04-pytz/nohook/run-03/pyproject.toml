[project]
name = "worldtime"
version = "0.1.0"
description = "Timezone-aware datetime helpers for working across world regions"
requires-python = ">=3.10"
dependencies = [
    "tzdata>=2024.1",
]

[project.scripts]
worldtime = "worldtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]
