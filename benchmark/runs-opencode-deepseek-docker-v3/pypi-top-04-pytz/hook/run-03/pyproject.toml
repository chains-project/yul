[project]
name = "worldtime"
version = "0.1.0"
description = "Timezone-aware datetime helpers for working across world regions"
requires-python = ">=3.10"
dependencies = [
    "tzdata>=2024.1",
]

[project.scripts]
worldtime = "worldtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldtime"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
