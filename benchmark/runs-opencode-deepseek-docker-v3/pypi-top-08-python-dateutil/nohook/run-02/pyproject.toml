[project]
name = "flexdate"
version = "0.1.0"
description = "Parse flexible, human-written date strings and compute relative date arithmetic."
requires-python = ">=3.9"
dependencies = [
    "python-dateutil>=2.9",
    "dateparser>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
flexdate = "flexdate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flexdate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
