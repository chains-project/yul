[project]
name = "humandate"
version = "0.1.0"
description = "Parse flexible human-written date strings and compute relative date arithmetic."
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.9",
    "dateparser>=1.2",
]

[project.scripts]
humandate = "humandate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humandate"]
