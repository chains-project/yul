[project]
name = "flexdate"
version = "0.1.0"
description = "Parse flexible human-written date strings and compute relative date arithmetic."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "dateparser>=1.2",
    "python-dateutil>=2.9",
]

[project.scripts]
flexdate = "flexdate.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flexdate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
