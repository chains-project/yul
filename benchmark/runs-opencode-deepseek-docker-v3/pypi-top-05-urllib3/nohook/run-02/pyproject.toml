[project]
name = "http-client"
version = "0.1.0"
description = "Low-level HTTP client with connection pooling and automatic retries"
readme = "README.md"
authors = [
    { name = "benchmark", email = "benchmark@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2.2",
]

[project.scripts]
http-client = "http_client.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "-q --disable-socket"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
