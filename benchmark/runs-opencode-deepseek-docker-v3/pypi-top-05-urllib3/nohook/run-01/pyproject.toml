[project]
name = "resilient-http"
version = "0.1.0"
description = "HTTP client with connection pooling and automatic retries"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "urllib3>=2.2",
]

[project.scripts]
resilient-http = "resilient_http.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
