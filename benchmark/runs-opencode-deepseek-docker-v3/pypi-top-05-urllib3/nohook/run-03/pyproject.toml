[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "httpkit"
version = "0.1.0"
description = "Low-level HTTP client with connection pooling and automatic retries"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "urllib3>=2.0,<3",
    "certifi>=2023.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
httpkit = "httpkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/httpkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
