[project]
name = "http-script"
version = "0.1.0"
description = "HTTP client with pooled connections and automatic retries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "urllib3>=2.8.0",
]

[project.scripts]
http-script = "http_script.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
