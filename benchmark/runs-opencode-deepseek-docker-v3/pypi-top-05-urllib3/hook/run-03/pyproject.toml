[project]
name = "http-client"
version = "0.1.0"
description = "Low-level HTTP client with connection pooling and automatic retries"
requires-python = ">=3.11"
dependencies = ["urllib3>=2.2"]

[project.scripts]
http-fetch = "http_client.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/http_client"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
