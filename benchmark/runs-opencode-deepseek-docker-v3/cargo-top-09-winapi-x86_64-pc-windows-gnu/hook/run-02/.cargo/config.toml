[target.x86_64-pc-windows-gnu]
# MinGW-w64 provides the linker and C runtime needed by the windows-gnu target.
# The shim prefers a system `x86_64-w64-mingw32-gcc` and falls back to a locally
# extracted toolchain. Replace with `linker = "x86_64-w64-mingw32-gcc"` if the
# cross toolchain is installed system-wide.
linker = "tools/mingw-linker.sh"
