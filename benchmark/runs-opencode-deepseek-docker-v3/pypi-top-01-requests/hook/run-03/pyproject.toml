[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-fetcher"
version = "0.1.0"
description = "Fetch JSON data from a REST API over HTTP."
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
api-fetcher = "api_fetcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
