[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "https-verify"
version = "0.1.0"
description = "Verify HTTPS connections against an up-to-date root CA bundle."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "certifi>=2025.1.31",
]

[project.scripts]
https-verify = "https_verify.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/https_verify"]
