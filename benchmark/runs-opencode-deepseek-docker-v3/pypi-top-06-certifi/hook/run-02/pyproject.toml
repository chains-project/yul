[project]
name = "ca-bundle"
version = "0.1.0"
description = "Up-to-date root CA certificate bundle for verifying HTTPS connections"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "certifi>=2024.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ca-bundle = "ca_bundle.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ca_bundle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
