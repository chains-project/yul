[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular"
version = "0.1.0"
description = "Load, clean and analyze tabular data from CSV files using the Python standard library."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["tabular*"]

[tool.setuptools.package-data]
tabular = ["py.typed"]
