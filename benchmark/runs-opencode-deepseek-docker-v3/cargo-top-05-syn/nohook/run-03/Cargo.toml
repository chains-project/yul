[workspace]
resolver = "2"
members = [
    "crates/rust-transform",
    "crates/rust-transform-macro",
    "crates/rust-transform-example",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
syn = { version = "3", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
