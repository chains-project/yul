[package]
name = "ast_transform"
version = "0.1.0"
edition = "2021"
description = "Procedural macro crate that parses Rust source into a syn AST and transforms it."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits", "visit", "visit-mut", "fold"] }

[lints.rust]
unsafe_code = "forbid"
