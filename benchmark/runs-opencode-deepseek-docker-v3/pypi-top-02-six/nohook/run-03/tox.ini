[tox]
# Every interpreter the library claims to support. Missing ones are skipped.
envlist = py27, py35, py36, py37, py38, py39, py310, py311, py312, py313, flake8
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    # pytest dropped Python 2 support in 5.0; pin the last compatible release.
    py27: pytest<5
    py27: mock
    py27: six
extras =
    test
commands = pytest {posargs}

[testenv:flake8]
basepython = python3
deps = flake8
commands = flake8 mylib tests setup.py

[testenv:build]
basepython = python3
deps = build
commands = python -m build

[testenv:wolf]
# Ensures setup.py itself is importable by a Python 2 interpreter.
basepython = python2.7
deps = setuptools
commands = python setup.py --version
