[tox]
envlist = py27, py35, py36, py37, py38, pypy, pypy3
skip_missing_interpreters = true

[testenv]
deps =
    py27: pytest<5
    py35,py36,py37,py38: pytest
commands =
    pytest {posargs}

[testenv:lint]
deps = flake8
commands = flake8 mylib tests setup.py

[flake8]
max-line-length = 100
exclude = .git,.tox,build,dist,*.egg-info
