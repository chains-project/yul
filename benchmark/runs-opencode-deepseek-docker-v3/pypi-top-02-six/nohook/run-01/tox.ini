[tox]
envlist = py27, py35, py36, py37, py38, py39, py310, py311, py312, py313, flake8
skip_missing_interpreters = true
minversion = 3.24

[testenv]
usedevelop = true
deps =
    six>=1.12.0
    pytest
    pytest-cov
commands =
    pytest --cov=mylib --cov-report=term-missing {posargs:tests}

[testenv:flake8]
basepython = python3
deps =
    flake8>=3.8,<4
    flake8-bugbear
skip_install = true
commands =
    flake8 mylib tests setup.py

[flake8]
max-line-length = 88
exclude = .git,.tox,build,dist
