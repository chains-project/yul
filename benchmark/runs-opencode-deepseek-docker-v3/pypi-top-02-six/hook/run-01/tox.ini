[tox]
envlist = py27,py35,py36,py37,py38,flake8
skip_missing_interpreters = true

[testenv]
deps =
    pytest
commands =
    pytest {posargs:tests}

[testenv:flake8]
skip_install = true
deps =
    flake8
commands =
    flake8 mylib tests setup.py

[testenv:build]
skip_install = true
deps =
    twine
    wheel
commands =
    python setup.py sdist bdist_wheel
    twine check dist/*
