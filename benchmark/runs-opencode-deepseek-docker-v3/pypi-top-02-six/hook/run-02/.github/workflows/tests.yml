name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "2.7",  os: ubuntu-20.04 }
          - { python: "3.5",  os: ubuntu-20.04 }
          - { python: "3.6",  os: ubuntu-20.04 }
          - { python: "3.7",  os: ubuntu-20.04 }
          - { python: "3.8",  os: ubuntu-20.04 }
          - { python: "3.9",  os: ubuntu-20.04 }
          - { python: "3.10", os: ubuntu-20.04 }
          - { python: "3.11", os: ubuntu-latest }
          - { python: "3.12", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing]"
      - name: Test
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install flake8
      - run: flake8 mylib tests setup.py
