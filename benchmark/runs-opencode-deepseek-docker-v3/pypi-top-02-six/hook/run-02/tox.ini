[tox]
envlist =
    py27
    py35
    py36
    py37
    py38
    py39
    py310
    py311
    py312
    py313
    flake8
skip_missing_interpreters = true

[testenv]
description = run the test suite
deps =
    pytest>=4.6.0
    pytest-cov
commands =
    pytest --cov=mylib {posargs}

[testenv:flake8]
description = lint the source tree
deps = flake8
commands =
    flake8 mylib tests setup.py

[testenv:docs]
description = build the docs (if a docs/ directory exists)
deps = sphinx
commands =
    sphinx-build -b html docs docs/_build/html
