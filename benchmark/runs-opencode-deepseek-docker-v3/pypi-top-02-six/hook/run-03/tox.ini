[tox]
# Test every interpreter the library claims to support. Python 2.7 reaches
# end-of-life in 2020, so it is kept here only to prove compatibility.
envlist = py27, py35, py36, py37, py38, py39
skip_missing_interpreters = true
isolated_build = false

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=mylib --cov-report=term-missing {posargs}

[testenv:lint]
deps =
    flake8
    black
    isort
skip_install = true
commands =
    flake8 mylib tests
    black --check mylib tests
    isort --check-only --recursive mylib tests
