[bdist_wheel]
# This library is pure Python and compatible with both Python 2 and 3,
# so publish a single "universal" wheel (py2.py3-none-any).
universal = 1

[metadata]
license_files = LICENSE

[tool:pytest]
testpaths = tests
addopts = -ra

[flake8]
max-line-length = 100
exclude = .git,.tox,build,dist
