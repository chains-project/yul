[package]
name = "crossplat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small platform abstraction layer built around readable conditional compilation."
license = "MIT OR Apache-2.0"
keywords = ["cross-platform", "portability", "cfg"]
categories = ["os"]

[dependencies]
cfg-if = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
