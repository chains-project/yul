[package]
name = "multiplatform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A cross-platform library that demonstrates clean, readable conditional compilation."
license = "MIT OR Apache-2.0"
categories = ["development-tools", "os"]
keywords = ["cross-platform", "cfg", "portability"]
include = ["/src", "/build.rs", "/Cargo.toml"]

[lib]
name = "multiplatform"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
