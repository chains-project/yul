[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "http-client"
version = "0.1.0"
description = "Script with low-level HTTP control: connection pooling and automatic retries"
requires-python = ">=3.6"
dependencies = [
    "urllib3>=1.26,<2",
]
