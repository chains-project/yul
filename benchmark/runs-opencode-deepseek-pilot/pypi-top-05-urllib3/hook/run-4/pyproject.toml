[project]
name = "http-client"
version = "0.1.0"
description = "Low-level HTTP client with connection pooling and automatic retries"
requires-python = ">=3.9"
dependencies = [
    "urllib3==2.8.0",
]

[project.scripts]
http-client = "http_client:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["http_client"]
