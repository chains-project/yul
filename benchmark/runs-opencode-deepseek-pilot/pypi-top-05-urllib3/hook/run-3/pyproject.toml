[project]
name = "httpclient"
version = "0.1.0"
description = "Low-level HTTP client with connection pooling and automatic retries"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "urllib3>=2.0,<3",
]

[project.scripts]
httpclient = "httpclient.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/httpclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
