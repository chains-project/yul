[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowlevel-http"
version = "0.1.0"
description = "HTTP client with connection pooling and automatic retries built on urllib3"
requires-python = ">=3.6"
dependencies = [
    "urllib3>=1.26,<2",
]

[project.scripts]
lowlevel-http = "lowlevel_http.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
