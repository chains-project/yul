[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "http-pool-client"
version = "0.1.0"
description = "Script demonstrating low-level HTTP control with connection pooling and automatic retries."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
py-modules = ["http_client"]
