[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "http-pool-client"
version = "0.1.0"
description = "Low-level HTTP client with connection pooling and automatic retries"
requires-python = ">=3.6"
dependencies = [
    "urllib3>=1.26,<2",
]

[project.scripts]
http-pool-client = "http_client.cli:main"

[tool.setuptools]
packages = ["http_client"]
