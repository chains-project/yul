[project]
name = "http-client"
version = "0.1.0"
description = "Low-level HTTP client with connection pooling and automatic retries"
readme = "README.md"
authors = [
    { name = "benchmark", email = "benchmark@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "urllib3>=2.8.0",
]

[project.scripts]
http-client = "http_client.__main__:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
