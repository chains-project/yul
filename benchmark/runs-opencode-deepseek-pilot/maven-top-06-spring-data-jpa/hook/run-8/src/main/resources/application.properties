spring.application.name=spring-data-jpa-demo

# Embedded H2 database. The file URL keeps data across restarts; swap it for a
# real server (PostgreSQL/MySQL) and add that driver to pom.xml in production.
spring.datasource.url=jdbc:h2:file:./data/demo;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at /h2-console
spring.h2.console.enabled=true
