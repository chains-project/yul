[project]
name = "api-fetch"
version = "0.1.0"
description = "Fetch data from a REST API over HTTP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
api-fetch = "api_fetch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_fetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
