[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rest-client"
version = "0.1.0"
description = "A small script that fetches data from a REST API over HTTP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rest-client contributors" }]
keywords = ["rest", "api", "http", "client", "requests"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.scripts]
rest-client = "rest_client.cli:main"

[project.urls]
Homepage = "https://example.com/rest-client"

[tool.hatch.build.targets.wheel]
packages = ["src/rest_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
