[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-fetch"
version = "0.1.0"
description = "Fetch data from a REST API over HTTP."
readme = "README.md"
requires-python = ">=3.6"
license = { text = "MIT" }
dependencies = [
    "requests>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[project.scripts]
rest-fetch = "rest_fetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
