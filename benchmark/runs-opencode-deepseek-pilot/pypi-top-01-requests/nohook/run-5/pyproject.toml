[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-fetcher"
version = "0.1.0"
description = "Fetch data from a REST API over HTTP."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.scripts]
api-fetcher = "api_fetcher.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api_fetcher"]
