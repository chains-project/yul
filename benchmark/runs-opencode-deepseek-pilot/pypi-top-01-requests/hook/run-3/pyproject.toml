[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-client"
version = "0.1.0"
description = "A small script that fetches data from a REST API over HTTP."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
api-client = "api_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
