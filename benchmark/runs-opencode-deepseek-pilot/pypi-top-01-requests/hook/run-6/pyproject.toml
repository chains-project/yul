[project]
name = "api-fetcher"
version = "0.1.0"
description = "Fetch data from a REST API over HTTP."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
api-fetcher = "api_fetcher.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
