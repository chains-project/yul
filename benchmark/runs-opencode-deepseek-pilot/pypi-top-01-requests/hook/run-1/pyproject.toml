[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-fetcher"
version = "0.1.0"
description = "Fetch data from a REST API over HTTP"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
]

[project.scripts]
rest-fetcher = "rest_fetcher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
