[project]
name = "rest-fetcher"
version = "0.1.0"
description = "A small script/library that fetches data from a REST API over HTTP."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.25",
]

[project.scripts]
rest-fetcher = "rest_fetcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rest_fetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
