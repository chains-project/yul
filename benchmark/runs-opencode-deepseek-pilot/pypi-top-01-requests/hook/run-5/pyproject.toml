[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-api-fetch"
version = "0.1.0"
description = "Fetch data from a REST API over HTTP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.34.2",
]

[project.scripts]
rest-api-fetch = "fetch_data:main"

[tool.setuptools]
py-modules = ["fetch_data"]
