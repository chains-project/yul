[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldclock"
version = "0.1.0"
description = "Timezone-aware datetime utilities across world regions"
requires-python = ">=3.9"
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
worldclock = "worldclock.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/worldclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
