[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "http-client"
version = "0.1.0"
description = "Script with low-level control over HTTP connections, pooling, and retries"
requires-python = ">=3.9"
dependencies = [
    "requests==2.34.2",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
http-client = "http_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
