[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idnatool"
version = "0.1.0"
description = "Encode and decode internationalized domain names per the IDNA specification (RFC 5891)."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TODO" }]
keywords = ["idna", "punycode", "domain", "unicode", "rfc5891"]
dependencies = ["idna>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
idna-tool = "idnatool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idnatool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
