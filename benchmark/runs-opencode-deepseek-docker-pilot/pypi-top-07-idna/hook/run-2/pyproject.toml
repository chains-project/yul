[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idn-toolkit"
version = "0.1.0"
description = "Encode and decode internationalized domain names (IDNA2008 / UTS #46)."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "idna>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
idn = "idn_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py39"
