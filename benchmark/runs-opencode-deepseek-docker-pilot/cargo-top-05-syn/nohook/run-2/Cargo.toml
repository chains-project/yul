[package]
name = "ast-tools"
version = "0.1.0"
edition = "2021"
description = "Procedural macros that parse Rust source into a syntax tree, inspect it, and transform it"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut", "extra-traits"] }
