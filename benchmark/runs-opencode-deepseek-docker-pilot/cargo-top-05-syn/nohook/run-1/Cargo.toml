[package]
name = "syn-transform"
version = "0.1.0"
edition = "2021"
description = "A procedural-macro crate that parses Rust syntax with syn"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit-mut"] }
