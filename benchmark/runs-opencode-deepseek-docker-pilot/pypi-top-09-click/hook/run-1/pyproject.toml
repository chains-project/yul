[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clitool"
version = "0.1.0"
description = "A command-line tool with multiple subcommands, options and argument parsing."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
clitool = "clitool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
