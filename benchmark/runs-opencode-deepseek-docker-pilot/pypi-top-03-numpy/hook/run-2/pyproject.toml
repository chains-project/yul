[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matrixlab"
version = "0.1.0"
description = "Heavy numerical array and matrix computations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
perf = ["numba>=0.58"]
dev = [
    "pytest>=7.4",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
]

[project.scripts]
matrixlab = "matrixlab.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/matrixlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
