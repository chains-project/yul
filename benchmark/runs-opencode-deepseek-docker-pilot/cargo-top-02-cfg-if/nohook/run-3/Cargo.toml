[package]
name = "portable"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Readable, compile-time conditional compilation across target platforms"
license = "MIT OR Apache-2.0"
keywords = ["cross-platform", "cfg", "portable"]
categories = ["development-tools"]

[dependencies]
cfg-if = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = "warn"
