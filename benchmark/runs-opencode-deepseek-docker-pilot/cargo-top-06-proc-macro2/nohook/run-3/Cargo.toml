[package]
name = "example-macro"
version = "0.1.0"
edition = "2021"
description = "A procedural-macro crate whose expansion logic targets proc-macro2 so it can be used and tested outside the compiler."
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
# Stable, usable-outside-the-compiler wrapper around the compiler's `proc_macro`
# token-stream API. The derive logic below is written against these types.
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
