[package]
name = "my-proc-macro"
version = "0.1.0"
edition = "2021"
description = "A procedural macro crate built on the stable proc-macro2 token stream API"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
