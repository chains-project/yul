[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "datephrase"
version = "0.1.0"
description = "Parse flexible, human-written date strings and compute relative date arithmetic."
requires-python = ">=3.9"
dependencies = [
    "python-dateutil>=2.8",
    "dateparser>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
datephrase = "datephrase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["DTZ"]
