[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csvlib"
version = "0.1.0"
description = "Load, clean and analyze tabular data from CSV files."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.0"]

[tool.setuptools.packages.find]
include = ["csvlib*"]
