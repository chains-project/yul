[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular"
version = "0.1.0"
description = "Load, clean and analyze tabular data from CSV files."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["tabular*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
