[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-validator"
version = "0.1.0"
description = "App for validating data models with Pydantic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic[email]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
model-validator = "model_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_validator"]
