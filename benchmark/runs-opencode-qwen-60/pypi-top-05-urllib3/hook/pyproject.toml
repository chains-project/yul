[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "http-conn-manager"
version = "0.1.0"
description = "Low-level HTTP connection management with pooling and automatic retries"
requires-python = ">=3.9"
dependencies = [
    "urllib3>=2.0.0",
]

[project.scripts]
http-conn-manager = "http_conn_manager.main:main"

[tool.setuptools.packages.find]
include = ["http_conn_manager*"]