[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "idna-domain-encoder"
version = "0.1.0"
description = "A script for encoding and decoding internationalized domain names per the IDNA specification."
requires-python = ">=3.8"
dependencies = [
    "idna==3.19",
]

[project.scripts]
idna-tool = "idna_domain_encoder:main"