name: Build and Upload Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@69d9d42ce44e0e5cdc1beab7f6402fe095ba7eba # v8.0.0

      - name: Set up Node.js
        uses: actions/setup-node@9a696cefee8e3f11bc05a9d3cce46fde6535f530 # v8.0.1
        with:
          node-version: '20'

      - name: Create build output
        run: |
          mkdir -p dist
          echo "Build output generated at $(date)" > dist/build.log
          echo "Commit: ${{ github.sha }}" >> dist/build.log
          echo "Branch: ${{ github.ref_name }}" >> dist/build.log
          echo '{"status": "success", "commit": "${{ github.sha }}"}' > dist/metadata.json
          echo "Build complete" > dist/index.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: dist/
          retention-days: 5