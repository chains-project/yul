[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexidate"
version = "0.1.0"
description = "Parse flexible human date strings and compute relative date arithmetic"
requires-python = ">=3.9"
dependencies = [
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
flexidate = "flexidate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]