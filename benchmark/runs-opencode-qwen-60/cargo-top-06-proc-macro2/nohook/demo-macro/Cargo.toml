[package]
name = "demo-macro"
version = "0.1.0"
edition = "2021"
description = "Demo proc-macro crate using tokenstream-wrapper"

[lib]
proc-macro = true

[dependencies]
tokenstream-wrapper = { path = "../tokenstream-wrapper" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }