[package]
name = "tokenstream-wrapper"
version = "0.1.0"
edition = "2021"
description = "A stable, usable-outside-the-compiler wrapper around Rust's token stream API"

[lib]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }